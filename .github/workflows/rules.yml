name: Shrinking rules
on:
  push:
    branches: [hytale0.7, 'codex/**']
  pull_request:
    branches: [hytale0.7]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/test.py
