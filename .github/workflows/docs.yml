name: Player guide checks
on:
  push:
    branches: [docs]
  pull_request:
    branches: [docs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref_name == 'docs' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
